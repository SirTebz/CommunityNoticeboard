name: Build and deploy Community Noticeboard

on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy the verified build to Azure App Service
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  id-token: write

env:
  DOTNET_VERSION: 8.0.x
  PROJECT_PATH: CommunityNoticeboard/CommunityNoticeboard.csproj

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - run: dotnet restore CommunityNoticeboard.slnx
      - run: dotnet build CommunityNoticeboard.slnx --configuration Release --no-restore
      - run: dotnet publish ${{ env.PROJECT_PATH }} --configuration Release --no-build
      - uses: actions/upload-artifact@v4
        with:
          name: communitynoticeboard
          path: CommunityNoticeboard/bin/Release/net8.0/publish

  deploy:
    if: github.event_name == 'workflow_dispatch' && inputs.deploy
    needs: build
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: communitynoticeboard
          path: ./publish
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ secrets.AZURE_WEBAPP_NAME }}
          package: ./publish
